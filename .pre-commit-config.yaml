# IRL™ — keep the terminal drama out of the diffs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: irl/quiz_bank.py
      - id: end-of-file-fixer
        exclude: irl/quiz_bank.py
      - id: check-yaml
      - id: check-json
        exclude: irl-vscode/snippets/snippets.json
      - id: check-added-large-files
        args: ["--maxkb=200"]
      - id: check-merge-conflict
